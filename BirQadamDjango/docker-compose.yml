services:
  web:
    build: .
    container_name: birqadam
    command: gunicorn volunteer_project.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery:
    build: .
    container_name: django_celery
    command: celery -A volunteer_project worker -l info
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ../BirQadamFrontend
      dockerfile: Dockerfile
    container_name: birqadam_frontend
    ports:
      - "127.0.0.1:4172:4173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8002