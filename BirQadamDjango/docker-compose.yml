services:
  web:
    build: .
    container_name: birqadam
    command: gunicorn volunteer_project.wsgi:application --bind 0.0.0.0:8002
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery:
    build: .
    container_name: django_celery
    command: celery -A volunteer_project worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  # если нужен celery beat — можешь включить
  # celery_beat:
  #   build: .
  #   container_name: django_celery_beat
  #   command: celery -A config beat -l info
  #   volumes:
  #     - .:/app
  #   env_file:
  #     - .env
  #   depends_on:
  #     - redis

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: birqadam_frontend
    ports:
      - "5173:5173"